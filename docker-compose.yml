services:
  # ---------------------------------------------------------------
  # PostgreSQL 15
  # ---------------------------------------------------------------
  postgres:
    image: postgres:15
    container_name: notifyhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-notifyhub}
      POSTGRES_USER:     ${DB_USERNAME:-notifyhub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-notifyhub_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-notifyhub} -d ${DB_NAME:-notifyhub}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------
  # RabbitMQ 3 (with management UI on 15672)
  # ---------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management
    container_name: notifyhub-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------
  # Redis 7
  # ---------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: notifyhub-redis
    restart: unless-stopped
    command: >-
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------
  # Spring Boot Application
  # ---------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notifyhub-app
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST:             postgres
      DB_PORT:             5432
      DB_NAME:             ${DB_NAME:-notifyhub}
      DB_USERNAME:         ${DB_USERNAME:-notifyhub}
      DB_PASSWORD:         ${DB_PASSWORD:-notifyhub_pass}
      RABBITMQ_HOST:       rabbitmq
      RABBITMQ_PORT:       5672
      RABBITMQ_USERNAME:   ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD:   ${RABBITMQ_PASSWORD:-guest}
      REDIS_HOST:          redis
      REDIS_PORT:          6379
      REDIS_PASSWORD:      ${REDIS_PASSWORD:-}
      JWT_SECRET:          ${JWT_SECRET}
      JWT_EXPIRATION:      ${JWT_EXPIRATION:-900000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      MAIL_USERNAME:       ${MAIL_USERNAME}
      MAIL_PASSWORD:       ${MAIL_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
